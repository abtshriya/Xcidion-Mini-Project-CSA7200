# ============================================================
#  XCIDION — Podman Compose Configuration
#  Self-hosted: PostgreSQL + FastAPI Backend + Vite Frontend
#
#  Usage:
#    podman-compose up -d
#    podman-compose logs -f xcidion-backend
#    podman-compose down
# ============================================================

version: '3.9'

services:
  # ──────────────────────────────────────────────────────────
  #  PostgreSQL 16 Database
  # ──────────────────────────────────────────────────────────
  xcidion-db:
    image: docker.io/postgres:16-alpine
    container_name: xcidion-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: xcidion_db
      POSTGRES_USER: xcidion
      POSTGRES_PASSWORD: xcidion_password
    volumes:
      - xcidion-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xcidion -d xcidion_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xcidion-net

  # ──────────────────────────────────────────────────────────
  #  FastAPI Backend
  # ──────────────────────────────────────────────────────────
  xcidion-backend:
    image: docker.io/python:3.11-slim
    container_name: xcidion-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - xcidion-models:/app/models
      - xcidion-pcaps:/app/data/pcaps
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn[standard] pydantic pydantic-settings
             sqlalchemy alembic pandas numpy scikit-learn shap networkx
             python-jose bcrypt python-multipart httpx psycopg2-binary email-validator websockets &&
             python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://xcidion:xcidion_password@xcidion-db:5432/xcidion_db
      SECRET_KEY: xcidion_dev_secret_change_in_production
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PCAP_UPLOAD_DIR: /app/data/pcaps
      ML_MODELS_DIR: /app/models
    ports:
      - "8000:8000"
    depends_on:
      xcidion-db:
        condition: service_healthy
    networks:
      - xcidion-net

  # ──────────────────────────────────────────────────────────
  #  Vite Development Frontend
  # ──────────────────────────────────────────────────────────
  xcidion-frontend:
    image: docker.io/node:20-alpine
    container_name: xcidion-frontend
    restart: unless-stopped
    working_dir: /app/frontend
    volumes:
      - .:/app
      - /app/frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: http://xcidion-backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - xcidion-backend
    networks:
      - xcidion-net

volumes:
  xcidion-db-data:
  xcidion-models:
  xcidion-pcaps:

networks:
  xcidion-net:
    driver: bridge
